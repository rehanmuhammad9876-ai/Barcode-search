
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#29231e">
<meta name="description" content="SCANSTOCK Inventory Management">
<title>SCANSTOCK</title>
<link rel="manifest" href="/manifest.json">

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
:root {
  --dark:#29231e;
  --brown:#765438;
  --brown2:#a47c55;
  --green:#239b57;
  --purple:#7951c8;
  --bg:#f5f3ef;
  --white:#fff;
  --muted:#89847e;
  --border:#e6e1db;
}

* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--dark);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea,select {font:inherit}
button {cursor:pointer;border:0}
header {
  background:var(--dark);
  color:white;
  padding:17px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}
.logo {
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
}
.menu-btn {
  background:#504236;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  font-weight:bold;
}
main {max-width:1150px;margin:auto;padding:20px}
.search-area {
  display:flex;
  gap:8px;
  margin-bottom:18px;
}
.search-area input {
  flex:1;
  min-width:0;
  padding:17px;
  border:1px solid var(--border);
  border-radius:12px;
  font-size:16px;
}
.action {
  color:white;
  padding:0 17px;
  border-radius:10px;
  font-weight:bold;
}
.green {background:var(--green)}
.purple {background:var(--purple)}
.brown {background:var(--brown)}
.dark {background:var(--dark)}
.panel {
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
}
.hero {
  max-width:440px;
  margin:0 auto;
}
.photo-frame {
  width:100%;
  aspect-ratio:4/5;
  background:#e9e4dc;
  border-radius:16px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.photo-frame img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.no-photo {color:var(--muted);font-size:18px}
.slider {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding:14px 0;
}
.slider button {
  background:var(--brown);
  color:white;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:22px;
}
.dots {display:flex;gap:6px;align-items:center}
.dot {
  width:8px;height:8px;border-radius:50%;
  background:#c9c0b6;
}
.dot.active {background:var(--brown);width:22px;border-radius:8px}
.photo-caption {
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
}
.detail {margin-top:20px}
.sku {
  font-size:clamp(36px,8vw,66px);
  font-weight:900;
  letter-spacing:1px;
  overflow-wrap:anywhere;
}
.name {font-size:26px;font-weight:bold;margin:5px 0}
.description {color:#716b65;margin:8px 0 20px}
.detail-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.detail-item {
  padding:14px;
  background:#f5f2ee;
  border-radius:10px;
}
.detail-item small {display:block;color:var(--muted);margin-bottom:7px}
.detail-item strong {font-size:19px}
.section-title {
  font-size:20px;
  font-weight:800;
  margin:24px 0 12px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.product-card {
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:9px;
  cursor:pointer;
  min-width:0;
}
.product-card img {
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  border-radius:9px;
  background:#eee9e2;
}
.product-card .sku-small {font-size:14px;font-weight:900;margin-top:8px}
.product-card .name-small {
  font-size:13px;margin:4px 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.product-card .stock-small {font-size:12px;color:var(--muted)}
.admin-only {display:none}
.admin .admin-only {display:inline-flex}
.toolbar {display:flex;gap:8px;flex-wrap:wrap}
.toolbar button {
  color:white;padding:11px 14px;border-radius:9px;
}
input,textarea,select {
  padding:12px;border:1px solid var(--border);
  border-radius:9px;width:100%;margin:5px 0 12px;
}
label {font-size:13px;font-weight:bold}
.modal {
  position:fixed;inset:0;background:#0009;
  z-index:30;display:none;overflow:auto;padding:20px;
}
.modal.show {display:flex;align-items:flex-start;justify-content:center}
.modal-box {
  background:white;border-radius:16px;
  padding:22px;width:100%;max-width:520px;
  margin:auto;
}
.modal-box h2 {margin-top:0}
.close {
  float:right;background:#eee;padding:8px 12px;border-radius:8px;
}
.primary {
  width:100%;background:var(--brown);
  color:white;padding:14px;border-radius:10px;
  font-weight:bold;
}
.result {white-space:pre-wrap;font-size:13px;color:#655d55}
.empty {padding:30px;text-align:center;color:var(--muted)}
#reader {width:100%;max-width:400px;margin:auto}
.hidden {display:none!important}
@media(max-width:700px) {
  main {padding:12px}
  .logo {font-size:22px}
  .grid {grid-template-columns:repeat(2,minmax(0,1fr))}
  .search-area {flex-wrap:wrap}
  .search-area input {flex-basis:100%}
  .search-area button {height:43px;flex:1}
}
</style>
</head>

<body>
<header>
  <div class="logo">SCANSTOCK</div>
  <button class="menu-btn" onclick="openMenu()">☰ MENU</button>
</header>

<main>
  <div class="search-area">
    <input id="search" placeholder="Cari SKU / Nama / Deskripsi"
      oninput="searchProducts()">
    <button class="action green" onclick="document.getElementById('photoInput').click()">FOTO</button>
    <button class="action purple" onclick="openScanner()">SCAN</button>
  </div>

  <input id="photoInput" type="file" accept="image/*"
    class="hidden" onchange="searchByPhoto(event)">

  <section class="panel hero" id="hero">
    <div class="photo-frame" id="photoFrame">
      <div class="no-photo">Belum ada foto barang</div>
    </div>
    <div class="slider">
      <button onclick="gantiFoto(-1)">←</button>
      <div class="dots" id="dots"></div>
      <button onclick="gantiFoto(1)">→</button>
    </div>
    <div class="photo-caption">
      <span id="photoCount">0 design foto</span>
      <span>Embedding siap dicari</span>
    </div>

    <div class="detail" id="detail">
      <div class="empty">Pilih barang untuk melihat detail.</div>
    </div>
  </section>

  <div class="section-title" id="listTitle">Daftar Barang</div>
  <div class="grid" id="productGrid"></div>

  <div class="empty hidden" id="empty">Barang tidak ditemukan.</div>

  <section class="panel admin-only">
    <h3>ADMINISTRATOR</h3>
    <div class="toolbar">
      <button class="brown" onclick="editProduct()">+ Tambah Barang</button>
      <button class="dark" onclick="importExcel()">Upload Excel / CSV</button>
      <button class="brown" onclick="document.getElementById('backupInput').click()">Restore Backup</button>
      <button class="green" onclick="backupNow()">Backup Sekarang</button>
    </div>
    <input type="file" id="excelInput" accept=".xlsx,.xls,.csv"
      class="hidden" onchange="processExcel(event)">
    <input type="file" id="backupInput" accept=".json"
      class="hidden" onchange="restoreBackup(event)">
    <div id="importReport" class="result"></div>
  </section>
</main>

<!-- MENU -->
<div class="modal" id="menuModal">
  <div class="modal-box">
    <button class="close" onclick="closeModal('menuModal')">TUTUP</button>
    <h2>MENU SCANSTOCK</h2>
    <button class="primary" onclick="loginAdmin()">Login Admin</button>
    <br><br>
    <div class="admin-only">
      <button class="primary" onclick="logoutAdmin()">Logout Admin</button>
    </div>
    <br>
    <button class="primary" onclick="offlineSearchMode()">Cari Foto Offline</button>
    <br><br>
    <button class="primary" onclick="geminiSearchMode()">Cari Foto Gemini</button>
  </div>
</div>

<!-- EDIT -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <button class="close" onclick="closeModal('editModal')">TUTUP</button>
    <h2 id="editTitle">Tambah Barang</h2>
    <form id="editForm" onsubmit="saveProduct(event)">
      <input type="hidden" id="editId">
      <label>SKU</label><input id="fSku" required>
      <label>Nama</label><input id="fNama" required>
      <label>Deskripsi</label><textarea id="fDesc"></textarea>
      <label>Stok</label><input id="fStok" type="number">
      <label>Harga</label><input id="fHarga" type="number">
      <label>Lokasi Rak</label><input id="fLokasi">
      <button class="primary" type="submit">SIMPAN BARANG</button>
    </form>
    <hr>
    <div class="admin-only">
      <label>Tambah Foto (maksimal 10 per SKU)</label>
      <input id="multiPhotos" type="file" accept="image/*" multiple>
      <button class="primary" onclick="uploadPhotos()">+ TAMBAH FOTO</button>
      <div id="photoAdminList"></div>
    </div>
  </div>
</div>

<!-- SCANNER -->
<div class="modal" id="scanModal">
  <div class="modal-box">
    <button class="close" onclick="stopScanner()">TUTUP</button>
    <h2>SCAN BARCODE</h2>
    <div id="reader"></div>
  </div>
</div>

<script>
// ================= CONFIG =================
const API = '';
let GEMINI_API_KEY = 'ISI_API_KEY_DI_SINI';
let GEMINI_MODEL = 'gemini-3.5-flash-lite';

let adminPIN = sessionStorage.getItem('scanstock_admin') || '';
let products = [];
let currentProduct = null;
let fotoList = [];
let indexFoto = 0;
let scanner = null;
let editingProductId = null;

function headers(extra={}) {
  return {...extra, 'x-admin-pin':adminPIN};
}
function money(n) {
  return 'Rp ' + Number(n||0).toLocaleString('id-ID');
}
function photoUrl(url) {
  return url || '';
}
function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  })[c]);
}
function openModal(id) {
  document.getElementById(id).classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
function openMenu() {openModal('menuModal')}

// ================= LOAD =================
async function loadProducts(q='') {
  try {
    const r=await fetch(API+'/api/products?q='+encodeURIComponent(q));
    if(!r.ok) throw new Error('Gagal memuat data');
    const j=await r.json();
    products=j.data||[];
    renderGrid(products);
  } catch(e) {
    console.error(e);
    document.getElementById('productGrid').innerHTML=
      '<div class="empty">Server belum terhubung.</div>';
  }
}

function renderGrid(list) {
  const grid=document.getElementById('productGrid');
  document.getElementById('empty').classList.toggle('hidden',list.length>0);
  grid.innerHTML=list.map(p=>`
    <div class="product-card" onclick="showDetail(${p.id})">
      ${p.foto?.[0]?.url
        ? `<img src="${escapeHTML(p.foto[0].url)}" loading="lazy">`
        : '<div class="photo-frame"></div>'}
      <div class="sku-small">${escapeHTML(p.sku)}</div>
      <div class="name-small">${escapeHTML(p.nama)}</div>
      <div class="stock-small">Stok: ${p.stok}</div>
    </div>
  `).join('');
}

let searchTimer;
function searchProducts() {
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>
    loadProducts(document.getElementById('search').value),180);
}

// ================= DETAIL =================
async function showDetail(id) {
  try {
    const r=await fetch(API+'/api/products/'+id);
    if(!r.ok) throw new Error('Barang tidak ditemukan');
    currentProduct=await r.json();
    fotoList=currentProduct.foto||[];
    indexFoto=0;
    renderDetail();
    window.scrollTo({top:0,behavior:'smooth'});
  } catch(e) {alert(e.message)}
}

function renderDetail() {
  if(!currentProduct)return;
  const p=currentProduct;
  const frame=document.getElementById('photoFrame');

  frame.innerHTML=fotoList.length
    ? `<img id="fotoUtama" src="${escapeHTML(fotoList[indexFoto].url)}">`
    : '<div class="no-photo">Foto belum tersedia</div>';

  document.getElementById('photoCount').textContent=
    fotoList.length+' design foto';

  document.getElementById('dots').innerHTML=
    fotoList.map((_,i)=>`<span class="dot ${i===indexFoto?'active':''}"></span>`).join('');

  document.getElementById('detail').innerHTML=`
    <div class="sku">${escapeHTML(p.sku)}</div>
    <div class="name">${escapeHTML(p.nama)}</div>
    <div class="description">${escapeHTML(p.deskripsi)}</div>
    <div class="detail-grid">
      <div class="detail-item"><small>STOK</small><strong>${p.stok}</strong></div>
      <div class="detail-item"><small>HARGA</small><strong>${money(p.harga)}</strong></div>
      <div class="detail-item" style="grid-column:span 2">
        <small>LOKASI RAK</small><strong>${escapeHTML(p.lokasi)}</strong>
      </div>
    </div>
    <div class="toolbar admin-only" style="margin-top:15px">
      <button class="brown" onclick="editProduct(${p.id})">EDIT</button>
      <button class="dark" onclick="deleteProduct(${p.id})">HAPUS</button>
    </div>
  `;

  document.body.classList.toggle('admin',!!adminPIN);
}

function gantiFoto(arah) {
  if(!fotoList.length)return;
  indexFoto=(indexFoto+arah+fotoList.length)%fotoList.length;
  renderDetail();
}

// ================= ADMIN =================
async function loginAdmin() {
  const pin=prompt('Masukkan PIN Admin');
  if(pin===null)return;
  try {
    const r=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin})
    });
    if(!r.ok)throw new Error('PIN salah');
    adminPIN=pin;
    sessionStorage.setItem('scanstock_admin',pin);
    document.body.classList.add('admin');
    closeModal('menuModal');
    if(currentProduct)renderDetail();
    alert('Login admin berhasil');
  } catch(e) {alert(e.message)}
}

function logoutAdmin() {
  adminPIN='';
  sessionStorage.removeItem('scanstock_admin');
  document.body.classList.remove('admin');
  closeModal('menuModal');
  if(currentProduct)renderDetail();
  alert('Logout berhasil');
}

function editProduct(id=null) {
  if(!adminPIN)return alert('Login admin terlebih dahulu');
  editingProductId=id;
  const p=id?products.find(x=>x.id===id)||currentProduct:null;
  document.getElementById('editTitle').textContent=
    p?'Edit Barang':'Tambah Barang';
  document.getElementById('editId').value=id||'';
  document.getElementById('fSku').value=p?.sku||'';
  document.getElementById('fNama').value=p?.nama||'';
  document.getElementById('fDesc').value=p?.deskripsi||'';
  document.getElementById('fStok').value=p?.stok??0;
  document.getElementById('fHarga').value=p?.harga??0;
  document.getElementById('fLokasi').value=p?.lokasi||'';
  document.getElementById('multiPhotos').value='';
  document.getElementById('photoAdminList').innerHTML='';
  openModal('editModal');
}

async function saveProduct(e) {
  e.preventDefault();
  const id=editingProductId;
  const data={
    sku:fSku.value.trim(),
    nama:fNama.value.trim(),
    deskripsi:fDesc.value,
    stok:Number(fStok.value),
    harga:Number(fHarga.value),
    lokasi:fLokasi.value
  };
  try {
    const r=await fetch('/api/products'+(id?'/'+id:''),{
      method:id?'PUT':'POST',
      headers:headers({'Content-Type':'application/json'}),
      body:JSON.stringify(data)
    });
    const j=await r.json();
    if(!r.ok)throw new Error(j.error);
    closeModal('editModal');
    await loadProducts();
    await showDetail(j.id||id);
    alert('Barang berhasil disimpan');
  } catch(e){alert(e.message)}
}

async function deleteProduct(id) {
  if(!adminPIN)return alert('Admin wajib login');
  if(!confirm('Yakin hapus barang ini?'))return;
  try {
    const r=await fetch('/api/products/'+id,{
      method:'DELETE',headers:headers()
    });
    const j=await r.json();
    if(!r.ok)throw new Error(j.error);
    currentProduct=null;
    document.getElementById('detail').innerHTML='<div class="empty">Pilih barang.</div>';
    await loadProducts();
  } catch(e){alert(e.message)}
}

// ================= IMAGE RESIZE =================
async function resizeImage(file) {
  const img=new Image();
  const url=URL.createObjectURL(file);
  img.src=url;
  await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=reject;
  });

  const scale=Math.min(1,1000/Math.max(img.width,img.height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(img.width*scale);
  canvas.height=Math.round(img.height*scale);
  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
  URL.revokeObjectURL(url);

  return new Promise(resolve=>
    canvas.toBlob(resolve,'image/jpeg',0.85)
  );
}

async function uploadPhotos() {
  if(!editingProductId)return alert('Simpan barang terlebih dahulu');
  const files=[...multiPhotos.files];
  if(!files.length)return alert('Pilih foto');
  try {
    const form=new FormData();
    for(const file of files) {
      form.append('photos',await resizeImage(file),
        file.name.replace(/\.[^.]+$/,'')+'.jpg');
    }
    const r=await fetch('/api/products/'+editingProductId+'/photos',{
      method:'POST',headers:headers(),body:form
    });
    const j=await r.json();
    if(!r.ok)throw new Error(j.error);
    alert('Foto berhasil ditambahkan');
    closeModal('editModal');
    await loadProducts();
    await showDetail(editingProductId);
  } catch(e){alert(e.message)}
}

// ================= EXCEL =================
function importExcel() {
  if(!adminPIN)return alert('Login admin terlebih dahulu');
  document.getElementById('excelInput').click();
}

async function processExcel(e) {
  const file=e.target.files[0];
  if(!file)return;
  try {
    const form=new FormData();
    form.append('file',file);
    const r=await fetch('/api/import',{
      method:'POST',headers:headers(),body:form
    });
    const j=await r.json();
    if(!r.ok)throw new Error(j.error);
    document.getElementById('importReport').textContent=
      j.message+'\nDaftar SKU double: '+JSON.stringify(j.skippedSKUs);
    await loadProducts();
    alert(j.message);
  } catch(err){alert(err.message)}
  e.target.value='';
}

// ================= BACKUP =================
async function backupNow() {
  if(!adminPIN)return alert('Login admin terlebih dahulu');
  try {
    const r=await fetch('/api/backup',{headers:headers()});
    if(!r.ok)throw new Error('Backup gagal');
    const blob=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='scanstock-backup.json';
    a.click();
    URL.revokeObjectURL(a.href);
  } catch(e){alert(e.message)}
}

async function restoreBackup(e) {
  const file=e.target.files[0];
  if(!file)return;
  if(!confirm('PERINGATAN: Data database sekarang akan diganti. Lanjutkan?'))return;
  try {
    const backup=JSON.parse(await file.text());
    const r=await fetch('/api/restore',{
      method:'POST',
      headers:headers({'Content-Type':'application/json'}),
      body:JSON.stringify(backup)
    });
    const j=await r.json();
    if(!r.ok)throw new Error(j.error);
    alert(j.message);
    await loadProducts();
  } catch(err){alert(err.message)}
  e.target.value='';
}

// ================= BARCODE =================
async function openScanner() {
  openModal('scanModal');
  scanner=new Html5Qrcode('reader');
  try {
    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:250,height:150}},
      async decodedText=>{
        await stopScanner();
        document.getElementById('search').value=decodedText;
        await loadProducts(decodedText);
        const found=products.find(p=>p.sku.toLowerCase()===decodedText.toLowerCase());
        if(found)showDetail(found.id);
        else alert('SKU tidak ditemukan: '+decodedText);
      },
      ()=>{}
    );
  } catch(e){alert('Kamera tidak dapat dibuka: '+e)}
}

async function stopScanner() {
  if(scanner) {
    try {
      if(scanner.isScanning)await scanner.stop();
      await scanner.clear();
    } catch(e){}
    scanner=null;
  }
  closeModal('scanModal');
}

// ================= IMAGE SEARCH OFFLINE =================
function getImageFeatures(source) {
  const canvas=document.createElement('canvas');
  canvas.width=32;canvas.height=32;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(source,0,0,32,32);
  const data=ctx.getImageData(0,0,32,32).data;

  const hist=new Array(12).fill(0);
  let edges=0,texture=0,grayPrev=0;

  for(let i=0;i<1024;i++) {
    const r=data[i*4],g=data[i*4+1],b=data[i*4+2];
    hist[Math.floor(r/64)]++;
    hist[4+Math.floor(g/64)]++;
    hist[8+Math.floor(b/64)]++;

    const gray=(r+g+b)/3;
    if(i%32!==0) {
      edges+=Math.abs(gray-grayPrev);
      texture+=Math.abs(gray-grayPrev);
    }
    grayPrev=gray;
  }
  return {
    hist:hist.map(x=>x/3072),
    edge:edges/1024,
    texture:texture/1024,
    data
  };
}

function featureSimilarity(a,b) {
  let color=0;
  for(let i=0;i<12;i++)color+=Math.abs(a.hist[i]-b.hist[i]);
  color=Math.max(0,1-color/2);

  const shape=Math.max(0,1-Math.abs(a.edge-b.edge)/100);
  const texture=Math.max(0,1-Math.abs(a.texture-b.texture)/100);

  return Math.round((color*40+shape*40+texture*20));
}

async function imageFromURL(url) {
  const img=new Image();
  img.crossOrigin='anonymous';
  img.src=url;
  await new Promise((resolve,reject)=>{
    img.onload=resolve;img.onerror=reject;
  });
  return img;
}

async function offlineSearchMode() {
  document.getElementById('photoInput').click();
  closeModal('menuModal');
}

async function searchByPhoto(e) {
  const file=e.target.files[0];
  if(!file)return;
  const queryImg=new Image();
  queryImg.src=URL.createObjectURL(file);
  await new Promise(r=>queryImg.onload=r);
  const target=getImageFeatures(queryImg);

  const results=[];
  for(const p of products) {
    if(!p.foto?.length)continue;
    try {
      const img=await imageFromURL(p.foto[0].url);
      const score=featureSimilarity(target,getImageFeatures(img));
      results.push({...p,score});
    } catch(err){}
  }

  results.sort((a,b)=>b.score-a.score);
  renderGrid(results.slice(0,10));
  document.getElementById('listTitle').textContent='10 Hasil Kemiripan Foto';
  URL.revokeObjectURL(queryImg.src);
  e.target.value='';
}

// ================= GEMINI IMAGE SEARCH =================
async function geminiSearchMode() {
  closeModal('menuModal');
  if(!GEMINI_API_KEY||GEMINI_API_KEY==='ISI_API_KEY_DI_SINI')
    return alert('Masukkan Gemini API Key di konfigurasi index.html');
  document.getElementById('photoInput').click();
}

async function searchGemini(file) {
  const blob=await resizeImage(file);
  const base64=await new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(blob);
  });

  const url=`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;

  const response=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{
        parts:[
          {text:'Lihat foto barang toko ini. Balas HANYA JSON: {"nama":"...","warna":"...","ciri":"...","keyword":"..."} Fokus pada warna, bentuk, dan ciri barang. Jangan membaca tulisan atau menggunakan OCR.'},
          {inline_data:{
            mime_type:'image/jpeg',
            data:base64
          }}
        ]
      }]
    })
  });
  if(!response.ok)throw new Error('Gemini API gagal');
  const result=await response.json();
  const text=result.candidates[0].content.parts[0].text;
  const clean=text.replace(/```json|```/g,'').trim();
  const info=JSON.parse(clean);
  const keywords=[info.nama,info.warna,info.ciri,info.keyword].filter(Boolean).join(' ');
  document.getElementById('search').value=keywords;
  await loadProducts(keywords);
}

// ================= START =================
document.getElementById('photoInput').addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file)return;
  if(GEMINI_API_KEY!=='ISI_API_KEY_DI_SINI'&&GEMINI_API_KEY) {
    if(confirm('Gunakan Gemini AI untuk pencarian foto?')) {
      try {await searchGemini(file)}
      catch(err){alert(err.message)}
    } else {
      await searchByPhoto(e);
    }
  } else {
    await searchByPhoto(e);
  }
});
