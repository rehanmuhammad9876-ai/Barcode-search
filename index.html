<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScanStock v3.5 - Tanpa SKU Kembar</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;padding:12px}
.top{display:flex;gap:10px;align-items:center}.logo{font-size:28px}h1{font-size:20px;margin:0}.small{font-size:12px;color:#94a3b8}
.card2{background:#1e293b;border-radius:14px;padding:12px;margin:10px 0;display:flex;gap:10px;justify-content:space-around;text-align:center}.card2 b{font-size:20px;display:block}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:#7c3aed;color:#fff;margin:4px 0}button.ghost{background:#334155}button.green{background:#16a34a}
input{width:100%;padding:13px;border-radius:12px;border:0;font-size:15px;margin:8px 0;color:#000}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.item{background:#1e293b;border-radius:14px;padding:10px;text-align:center}.item b{display:block;margin:6px 0 2px;font-size:13px}.price{color:#a78bfa;font-weight:800}.box{background:#1e293b;border-radius:14px;padding:14px;margin:10px 0}.hide{display:none}.sku{font-size:11px;color:#94a3b8}.rak{font-size:11px;color:#fbbf24}
#status{font-size:12px;color:#fbbf24}
</style>
</head>
<body>
<div class="top"><div class="logo">📦</div><div><h1>ScanStock v3.5</h1><div class="small">Cari Barang + Foto + Barcode - Tanpa SKU Kembar</div></div></div>
<div class="card2"><div><b id="jml">0</b>Barang</div><div><b id="jmlTampil">0</b>Ditemukan</div><div><b id="jmlStok">0</b>Total Stok</div></div>
<div id="status" class="box">⏳ Loading data.xlsx... Tunggu sebentar...</div>
<input id="searchInput" placeholder="Cari barang / SKU / Rak..." oninput="tampil()">
<div><button onclick="scanBarcode()">📷 SCAN BARCODE</button> <button onclick="document.getElementById('fileFoto').click()" class="green">🖼️ CARI PAKAI FOTO v3.5</button></div>
<input type="file" id="fileFoto" accept="image/*" onchange="cariFoto(this)" class="hide">
<div id="hasilFoto" class="box hide"></div>
<div id="grid"></div>
<div id="kosong" class="box">Belum ada data. Pastikan file data.xlsx sudah di-upload ke GitHub.</div>
<script>
let barang=[];
async function loadData(){
  try{
    let r=await fetch('data.xlsx');
    if(!r.ok) throw new Error('data.xlsx tidak ketemu');
    let buf=await r.arrayBuffer();
    let wb=XLSX.read(buf,{type:'array'});
    let ws=wb.Sheets[wb.SheetNames[0]];
    let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    barang=[];
    let sudahAda=new Set();
    let dibuang=0;
    for(let i=1;i<rows.length;i++){
      let row=rows[i];
      let sku=String(row[0]||'').trim();
      let nama=String(row[1]||row[2]||'').trim();
      if(!nama && !sku) continue;
      // SKU KEMBAR JANGAN DIAJAK - kalau udah ada, skip
      if(sku){
        if(sudahAda.has(sku)){ dibuang++; continue; }
        sudahAda.add(sku);
      }
      let harga=Number(row[3])||0;
      let stok=Number(row[4])||0;
      let rak=String(row[5]||'').trim();
      barang.push({id:i,sku:sku,nama:nama,harga:harga,stok:stok,rak:rak});
    }
    document.getElementById('status').innerHTML='✅ Data ke-load: <b>'+barang.length+' barang</b> | SKU kembar dibuang: '+dibuang+' | Dari total baris: '+(rows.length-1);
    document.getElementById('jml').innerText=barang.length;
    document.getElementById('jmlStok').innerText=barang.reduce((a,b)=>a+Number(b.stok||0),0);
    tampil();
  }catch(e){
    document.getElementById('status').innerHTML='❌ Gagal load: '+e.message+'<br>Pastikan file namanya <b>data.xlsx</b> dan satu folder dengan index.html';
  }
}
function tampil(){
  let q=document.getElementById('searchInput').value.toLowerCase().trim();
  let g=document.getElementById('grid');
  g.innerHTML='';
  let list=barang;
  if(q) list=barang.filter(b=>(b.nama+' '+b.sku+' '+b.rak).toLowerCase().includes(q));
  document.getElementById('jmlTampil').innerText=list.length;
  document.getElementById('kosong').style.display=list.length?'none':'block';
  list.slice(0,200).forEach(b=>{
    let d=document.createElement('div');d.className='item';
    d.innerHTML='<b>'+b.nama+'</b><div class="sku">SKU: '+b.sku+'</div><div class="price">Rp '+Number(b.harga).toLocaleString('id-ID')+'</div><div>Stok: '+b.stok+'</div><div class="rak">📍 '+(b.rak||'-')+'</div>';
    g.appendChild(d);
  });
  if(list.length>200) g.innerHTML+='<div class="box">Menampilkan 200 dari '+list.length+' hasil. Ketik lebih spesifik untuk mempersempit.</div>';
}
function scanBarcode(){
  let kode=prompt('Scan / Ketik Barcode / SKU:');
  if(!kode) return;
  document.getElementById('searchInput').value=kode;
  tampil();
  let ketemu=barang.filter(b=>b.sku==kode.trim());
  if(ketemu.length) alert('Ketemu: '+ketemu[0].nama+' - Rp '+ketemu[0].harga);
  else alert('SKU '+kode+' tidak ketemu di '+barang.length+' barang.');
}
async function cariFoto(el){
  if(!el.files[0]) return;
  let box=document.getElementById('hasilFoto');box.classList.remove('hide');
  box.innerHTML='⏳ v3.5 lagi baca foto... (OCR)';
  try{
    let res=await Tesseract.recognize(el.files[0],'eng');
    let teks=res.data.text.trim();
    box.innerHTML='<b>Hasil baca foto (v3.5):</b><br>'+(teks||'(tidak ada teks terbaca)')+'<br><br><button onclick="pakaiHasilFoto()">Cari di database</button>';
    window._teksFoto=teks;
  }catch(e){ box.innerHTML='Gagal baca foto: '+e.message; }
}
function pakaiHasilFoto(){
  let t=(window._teksFoto||'').split('\n')[0]||'';
  let kata=t.split(' ').sort((a,b)=>b.length-a.length)[0]||t;
  document.getElementById('searchInput').value=kata;
  tampil();
  document.getElementById('hasilFoto').innerHTML+='<br>🔍 Dicari: <b>'+kata+'</b>';
}
loadData();
</script>
</body>
</html>
